name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *' # nightly, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      API_URL: ${{ vars.API_URL || 'https://api.realworld.show' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14